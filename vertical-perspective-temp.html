<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zombie billboard — continuous-facing perspective correction</title>
<style>
  :root {font:13px/1.45 system-ui,sans-serif;color-scheme:dark}
  * {box-sizing:border-box}
  html,body {margin:0;width:100%;height:100%;overflow:hidden;background:#142333;color:#e8f2ff}
  #viewport {position:fixed;inset:0;overflow:hidden;perspective:850px;perspective-origin:50% 50%;
    background:linear-gradient(#18314b,#6e91a5 68%,#a5b6b5)}
  #scene {position:absolute;left:50%;top:50%;width:0;height:0;
    transform:translateZ(850px);transform-style:preserve-3d}
  #world {position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
  #ground {position:absolute;left:-5000px;top:-5000px;width:10000px;height:10000px;
    transform-style:preserve-3d;backface-visibility:visible;
    background-color:#415b59;
    background-image:linear-gradient(90deg,#152b3680 2px,transparent 2px),
      linear-gradient(#152b3680 2px,transparent 2px),
      linear-gradient(90deg,#c9e6d43b 1px,transparent 1px),
      linear-gradient(#c9e6d43b 1px,transparent 1px);
    background-size:250px 250px,250px 250px,50px 50px,50px 50px}
  .plane {position:absolute;left:-45px;top:-180px;width:90px;height:180px;
    transform-origin:45px 180px;backface-visibility:visible;will-change:transform}
  #sprite {left:-36.486486px;top:-141.559322px;transform-origin:36.486486px 141.559322px}
  #sprite canvas {display:block;width:90px;height:180px;image-rendering:pixelated}
  .face {position:absolute;transform-origin:center center;backface-visibility:visible;
    display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:11px;font-weight:750;letter-spacing:.03em;color:#18252c;text-shadow:0 1px 0 #ffffff65;
    border:1px solid #16283675;overflow:hidden;padding:2px}
  .face .vertical-label {writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap}
  .foot {position:absolute;width:12px;height:12px;left:-6px;top:-6px;border-radius:50%;
    background:#fff8c5;box-shadow:0 0 15px #fff8c5;transform:rotateX(90deg)}
  #transverseOverlay {position:fixed;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  #reticle {position:fixed;left:50%;top:50%;width:10px;height:10px;pointer-events:none;
    transform:translate(-50%,-50%);border:1px solid #ffffffa6;border-radius:50%}
  #panel {position:fixed;top:14px;left:14px;width:min(352px,calc(100vw - 28px));
    background:transparent;border:1px solid transparent;border-radius:13px;
    padding:13px 15px;backdrop-filter:none;max-height:calc(100vh - 28px);overflow:auto;
    opacity:.7;transition:opacity .2s,background-color .2s,border-color .2s,backdrop-filter .2s;
    text-shadow:-1px 0 #06111c,1px 0 #06111c,0 -1px #06111c,0 1px #06111c,0 2px 4px #06111c}
  #panel:hover,#panel:focus-within {opacity:1;background:#0b192738;
    border-color:#98c2d328;backdrop-filter:blur(4px)}
  #panel[hidden] {display:none}
  #panel h1 {font-size:15px;margin:0 0 4px}
  #panel p {margin:0 0 12px;color:#a9c0d2;font-size:12px}
  .control {display:grid;grid-template-columns:116px 1fr;align-items:center;gap:10px;margin:7px 0}
  .control label {color:#d8e7ef;font-size:12px}
  select,input[type=range] {width:100%;accent-color:#6cdbcd}
  select,button {background:#1f3547;color:#e6f3f8;border:1px solid #7295a44f;border-radius:6px;padding:6px}
  .toggle-row {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:7px 0}
  .toggle-control {min-width:0}
  .toggle-button {display:block;position:relative;cursor:pointer}
  .toggle-button input {position:absolute;opacity:0;width:1px;height:1px}
  .toggle-button > span {display:flex;align-items:center;justify-content:center;text-align:center;width:100%;height:100%;min-height:32px;padding:7px 8px;
    background:#65717b;color:#fff;border:1px solid #7295a44f;border-radius:6px;font-size:11px;font-weight:600;
    text-shadow:0 1px 2px #000,0 0 4px #000b,1px 1px 0 #0009,-1px -1px 0 #0009}
  .toggle-button input:checked + span {background:#6cdbcd;color:#fff;border-color:#6cdbcd}
  .toggle-button input:focus-visible + span {outline:2px solid #e6f3f8;outline-offset:2px}
  .toggle-button .when-off {display:none}
  .toggle-button input:not(:checked) + span .when-on {display:none}
  .toggle-button input:not(:checked) + span .when-off {display:inline}
  .presets {display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
  .presets button {cursor:pointer;font-size:11px}
  #stats {white-space:pre-wrap;font:11px/1.6 ui-monospace,monospace;
    color:#aecbe0;border-top:1px solid #ffffff24;margin-top:12px;padding-top:9px}
  #help {position:fixed;right:15px;bottom:15px;background:#0b1927df;
    border:1px solid #98c2d347;border-radius:10px;padding:10px 13px;font-size:11px;color:#d3e8f6;pointer-events:none}
  #help kbd {color:#fff;border:1px solid #e4f5ff5c;padding:0 4px;border-radius:3px}
  @media(max-width:650px){#help {bottom:9px;right:9px;max-width:260px}}
</style>
</head>
<body>
<div id="viewport"><div id="scene"><div id="world"><div id="ground"></div></div></div></div>
<svg id="transverseOverlay" aria-label="Top-center transverse position and extrema">
  <line id="transverseGuide" stroke="#f9ed7b" stroke-width="1.5" stroke-dasharray="2 5"/>
  <circle id="transverseMinimum" r="5" fill="#72e4d2" stroke="#173041" stroke-width="1"/>
  <circle id="transverseMaximum" r="5" fill="#ff9a76" stroke="#173041" stroke-width="1"/>
  <circle id="transverseCurrent" r="3" fill="#fff"/>
</svg>
<div id="reticle"></div>
<section id="panel">
  <h1>Zombie billboard — continuous-facing perspective correction</h1>
  <p>Perspective-corrected zombie beside a six-faced reference prism.</p>
  <div class="toggle-row">
    <div class="toggle-control"><label class="toggle-button"><input type="checkbox" id="manualShear" checked><span>Auto correction only</span></label></div>
  </div>
  <div class="control"><label for="tilt">Max X tilt <output id="tiltRead">23°</output></label><input id="tilt" type="range" min="0" max="70" value="23"></div>
  <div class="control"><label for="shear">Manual X shear <output id="shearRead">0.00</output></label><input id="shear" type="range" min="-150" max="150" value="0" step="1"></div>
  <div class="control"><label for="warp">Target orientation blend <output id="warpRead">250%</output></label><input id="warp" type="range" min="0" max="350" value="250" step="5"></div>
  <div class="control"><label for="shortening">Projected height shortening <output id="shortRead">0%</output></label><input id="shortening" type="range" min="0" max="100" value="0"></div>
  <div class="toggle-row">
    <div class="toggle-control"><label class="toggle-button"><input type="checkbox" id="debugBox"><span>Sprite debug box</span></label></div>
    <div class="toggle-control"><label class="toggle-button"><input type="checkbox" id="extrema"><span>Min/max guide</span></label></div>
  </div>
  <div class="control"><label for="speed">Flight speed <output id="speedRead">280</output></label><input id="speed" type="range" min="80" max="900" step="20" value="280"></div>
  <div class="presets">
    <button data-preset="horizontal">Horizontal</button>
    <button data-preset="oblique">Oblique</button>
    <button data-preset="overhead">Overhead</button>
    <button data-preset="direct">Directly above</button>
    <button data-preset="boundary">Blend boundary</button>
  </div>
  <div id="stats">Calculating…</div>
</section>
<div id="help"><kbd>W A S D</kbd> move · <kbd>Space</kbd>/<kbd>Shift</kbd> altitude
  <kbd>Mouse</kbd> look · <kbd>Arrows</kbd> look · <kbd>Ctrl</kbd> boost · <kbd>R</kbd> clear guide · <kbd>H</kbd> hide UI · <kbd>Esc</kbd> unlock</div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const world=$('world'), ground=$('ground'), viewport=$('viewport');
  const tiltEl=$('tilt'), shortenEl=$('shortening');
  const speedEl=$('speed'), warpEl=$('warp'), debugBoxEl=$('debugBox'), extremaEl=$('extrema');
  const autoShearEl=$('manualShear'), shearEl=$('shear');
  const stats=$('stats'), RAD=Math.PI/180, F=850;
  const W=90,H=180;
  const spritePosition={x:0,y:0,z:0};
  const prismPosition={x:155,y:0,z:0};
  const start="overhead";
  const presets={
    horizontal:{x:121,y:-70,z:506,yaw:0,pitch:5},
    oblique:{x:121,y:-191,z:358,yaw:0,pitch:38},
    overhead:{x:35,y:-622,z:171,yaw:0,pitch:76},
    direct:{x:0,y:-661,z:0,yaw:0,pitch:90},
    boundary:{x:74,y:-661,z:74,yaw:0,pitch:79}
  };
  const camera={...presets[start]};
  // Extrema belong to the current single-axis WASD movement session.
  const transverseExtrema={axis:null,min:Infinity,max:-Infinity};
  const keys=new Set();
  // The canvas displays a directional zombie frame from assets/sprites/.
  // An optional debug grid and frame reveal the underlying plane boundaries
  // that would otherwise be hidden by transparent image pixels.
  const img=document.createElement('canvas');
  img.width=W; img.height=H;
  const ctx=img.getContext('2d');
  const zombieImage=new Image();
  let selectedDirection=0, selectedMirror=false;
  // Draw in order: optional debug background, directional frame, optional border.
  function drawDebugBackground(){
    ctx.fillStyle='#193949';ctx.fillRect(0,0,W,H);
    for(let y=0;y<H;y+=20){
      ctx.fillStyle=y%40===0?'#224e5b':'#1d4351';
      ctx.fillRect(0,y,W,1);
    }
    for(let x=0;x<W;x+=15){ctx.fillStyle='#48788880';ctx.fillRect(x,0,1,H)}
  }
  function drawZombieTexture(){
    if(zombieImage.complete&&zombieImage.naturalWidth){
      ctx.imageSmoothingEnabled=false;
      ctx.save();
      if(selectedMirror){ctx.translate(W,0);ctx.scale(-1,1)}
      ctx.drawImage(zombieImage,selectedDirection*128+50,42,37,59,0,12,90,156);
      ctx.restore();
    }
  }
  function drawDebugFrame(){
    ctx.fillStyle='#b5e9e2';ctx.fillRect(0,0,W,5);
    ctx.fillStyle='#eac677';ctx.fillRect(0,H-6,W,6);
    ctx.strokeStyle='#ffdc7b';ctx.lineWidth=3;
    ctx.strokeRect(1.5,1.5,W-3,H-3);
  }
  function drawSprite(){
    ctx.clearRect(0,0,W,H);
    if(debugBoxEl.checked)drawDebugBackground();
    drawZombieTexture();
    if(debugBoxEl.checked)drawDebugFrame();
  }
  zombieImage.onload=drawSprite;
  debugBoxEl.addEventListener('change',drawSprite);
  drawSprite();
  zombieImage.src='assets/sprites/zombie.png';
  // Construct the sprite, six prism faces, and their two ground markers.
  function createSprite(){
    const sprite=document.createElement('div');
    sprite.id='sprite';sprite.className='plane';sprite.append(img);world.append(sprite);
    const topCenter=document.createElement('span');
    topCenter.style.cssText='position:absolute;left:50%;top:0;width:0;height:0;pointer-events:none';
    sprite.append(topCenter);
    return {sprite,topCenter};
  }
  // Every face is a separate CSS 3D plane; face width controls whether the
  // label is vertical (the narrow 30-unit side faces).
  const makeFace=(name,width,height,color,x,y,z,rotation)=>{
    const el=document.createElement('div');
    el.className='face';
    const label=document.createElement('span');label.textContent=name;
    if(width<45)label.className='vertical-label';
    el.append(label);
    el.style.width=width+'px';el.style.height=height+'px';
    el.style.left=-width/2+'px';el.style.top=-height/2+'px';
    el.style.background=color;
    el.style.transform=`translate3d(${x}px,${y}px,${z}px) ${rotation}`;
    world.append(el);
  };
  function createPrism(){
    const p=prismPosition, prismW=75, prismH=140, prismD=30;
    makeFace('FRONT',prismW,prismH,'#a1c879',p.x,-prismH/2,p.z+prismD/2,'rotateY(0deg)');
    makeFace('BACK',prismW,prismH,'#7486aa',p.x,-prismH/2,p.z-prismD/2,'rotateY(180deg)');
    makeFace('LEFT',prismD,prismH,'#5d96b6',p.x-prismW/2,-prismH/2,p.z,'rotateY(-90deg)');
    makeFace('RIGHT',prismD,prismH,'#e2a25e',p.x+prismW/2,-prismH/2,p.z,'rotateY(90deg)');
    makeFace('TOP',prismW,prismD,'#f0d596',p.x,-prismH,p.z,'rotateX(90deg)');
    makeFace('BOTTOM',prismW,prismD,'#755a80',p.x,0,p.z,'rotateX(-90deg)');
  }
  function createGroundMarkers(){
    for(const position of [spritePosition,prismPosition]){
      const foot=document.createElement('div');foot.className='foot';
      foot.style.transform=`translate3d(${position.x}px,-2px,${position.z}px) rotateX(90deg)`;
      world.append(foot);
    }
  }
  const {sprite,topCenter}=createSprite();
  createPrism();
  createGroundMarkers();
  // Convert world coordinates to camera-space lateral, vertical, and depth
  // coordinates. Camera/world Y is positive downward; visible depth is > 0.
  function cameraSpace(x,y,z){
    const dx=x-camera.x,dy=y-camera.y,dz=z-camera.z;
    const yaw=camera.yaw*RAD,pitch=camera.pitch*RAD;
    const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
    const forward=-sy*dx+cy*dz;
    return {x:cy*dx+sy*dz,y:cp*dy+sp*forward,depth:sp*dy-cp*forward};
  }
  // Project a world-space point to viewport pixels; reject points behind
  // the camera or too close to its projection plane.
  function projectWorld(x,y,z){
    const v=cameraSpace(x,y,z);
    if(v.depth<=0.01)return null;
    return {x:innerWidth/2+F*v.x/v.depth,y:innerHeight/2+F*v.y/v.depth};
  }
  // Map the sprite plane's local axes and fixed feet position into a
  // homogeneous camera projection; rows are screen X, screen Y, and depth.
  function planeProjectionMatrix(facing,tilt){
    const {foot,x,y}=projectedAxisBasis(facing,tilt);
    return [[x[0],y[0],foot[0]],
            [x[1],y[1],foot[1]],
            [x[2],y[2],foot[2]]];
  }
  // Apply a 3×3 projective transform to local XY and divide by homogeneous w.
  // Preserve w so callers can reject points behind the projection plane.
  function transform3(M,x,y){
    const w=M[2][0]*x+M[2][1]*y+M[2][2];
    return {x:(M[0][0]*x+M[0][1]*y+M[0][2])/w,
      y:(M[1][0]*x+M[1][1]*y+M[1][2])/w,w};
  }
  // Apply an additional horizontal shear to the local texture coordinates.
  function shearLocalX(local,shear){
    return local.map(row=>[row[0],row[0]*shear+row[1],row[2]]);
  }
  // Invert a projective 3×3 matrix. Return null for singular or nonfinite
  // determinants rather than applying an unstable correction.
  function invert3(a){
    const det=a[0][0]*(a[1][1]*a[2][2]-a[1][2]*a[2][1])
      -a[0][1]*(a[1][0]*a[2][2]-a[1][2]*a[2][0])
      +a[0][2]*(a[1][0]*a[2][1]-a[1][1]*a[2][0]);
    if(!Number.isFinite(det)||Math.abs(det)<1e-10)return null;
    const inv=1/det;
    return [
      [(a[1][1]*a[2][2]-a[1][2]*a[2][1])*inv,(a[0][2]*a[2][1]-a[0][1]*a[2][2])*inv,(a[0][1]*a[1][2]-a[0][2]*a[1][1])*inv],
      [(a[1][2]*a[2][0]-a[1][0]*a[2][2])*inv,(a[0][0]*a[2][2]-a[0][2]*a[2][0])*inv,(a[0][2]*a[1][0]-a[0][0]*a[1][2])*inv],
      [(a[1][0]*a[2][1]-a[1][1]*a[2][0])*inv,(a[0][1]*a[2][0]-a[0][0]*a[2][1])*inv,(a[0][0]*a[1][1]-a[0][1]*a[1][0])*inv]
    ];
  }
  // Derive projected axes from viewing geometry and the width, height,
  // and top-anchor constraints.
  function interpolateTargetOrientation(screenBearing,strength){
    const sectorIndex=Math.floor(screenBearing/(Math.PI/2));
    const sectorFraction=screenBearing/(Math.PI/2)-sectorIndex;
    const sectorOrientation=(sectorIndex+0.5)*Math.PI/2-camera.yaw*RAD;
    const adjacentOrientation=(sectorIndex+(sectorFraction<0.5?-0.5:1.5))
      *Math.PI/2-camera.yaw*RAD;
    const distance=Math.abs(sectorFraction-0.5)*2;
    const ease=distance*distance*(3-2*distance);
    const blendWeight=0.5*ease*Math.min(1,Math.max(0,strength/2.5));
    const orientationX=(1-blendWeight)*Math.cos(sectorOrientation)+blendWeight*Math.cos(adjacentOrientation);
    const orientationZ=(1-blendWeight)*Math.sin(sectorOrientation)+blendWeight*Math.sin(adjacentOrientation);
    const targetFacing=Math.atan2(orientationZ,orientationX);
    return {targetFacing,blendWeight};
  }
  // Compute projected width and height constraints. Width uses the full
  // camera displacement; height uses its forward and altitude components.
  function projectedSizeConstraints(tilt,desired,dx,dz){
    const yaw=camera.yaw*RAD;
    const sy=Math.sin(yaw),cy=Math.cos(yaw);
    const forward=-sy*dx+cy*dz;
    const altitude=camera.y-spritePosition.y;
    const widthDistance=Math.hypot(altitude,dx,dz);
    const heightDistance=Math.hypot(altitude,forward);
    if(widthDistance<=0.01||heightDistance<=0.01)return null;
    const pitch=camera.pitch*RAD;
    const width=F*W/widthDistance;
    const height=F*H*desired*Math.abs(
      Math.cos(pitch)+Math.sin(pitch)*Math.tan(tilt)/Math.SQRT2
    )/heightDistance;
    return {width,height};
  }
  // Derive the sprite's horizontal and vertical projection axes directly
  // from their world directions and the camera orientation.
  function projectedAxisBasis(facing,tilt){
    const foot=cameraSpace(spritePosition.x,spritePosition.y,spritePosition.z);
    const yaw=camera.yaw*RAD,pitch=camera.pitch*RAD;
    const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
    const s=Math.sin(facing),c=Math.cos(facing),t=Math.tan(tilt);
    const sideForward=-sy*c-cy*s;
    const downLateral=t*(cy*s+sy*c);
    const downForward=t*(-sy*s+cy*c);
    return {
      foot:[F*foot.x,F*foot.y,foot.depth],
      x:[F*(cy*c-sy*s),F*sp*sideForward,-cp*sideForward],
      y:[F*downLateral,F*(cp+sp*downForward),sp-cp*downForward]
    };
  }
  // Solve horizontal and vertical scales using perspective derivatives
  // at the sprite's ground anchor.
  function fitAxisScales(basis,width,height){
    const {foot,x,y}=basis;
    const depth=foot[2];
    if(depth<=0.01)return null;
    const xMagnitude=Math.hypot(x[0]*depth-foot[0]*x[2],x[1]*depth-foot[1]*x[2]);
    const yMagnitude=Math.hypot(y[0]*depth-foot[0]*y[2],y[1]*depth-foot[1]*y[2]);
    const halfWidth=W/2;
    const b=W*xMagnitude;
    const a=width*Math.pow(halfWidth*x[2],2);
    const fitX=2*width*depth*depth/
      (b+Math.sqrt(b*b+4*a*width*depth*depth));
    const heightDenominator=H*(yMagnitude+height*depth*y[2]);
    const fitY=height*depth*depth/heightDenominator;
    if(!Number.isFinite(fitX+fitY)||fitX<=0||fitY<=0)return null;
    return {fitX,fitY};
  }
  // Preserve the fitted vertical depth while anchoring the projected top
  // to the corresponding upright point above the sprite's feet.
  function anchoredVerticalAxis(basis,fitY,desired){
    const foot=basis.foot;
    const verticalDepth=basis.y[2]*fitY;
    const topDepth=foot[2]-H*verticalDepth;
    const pitch=camera.pitch*RAD;
    const uprightDepth=foot[2]-H*desired*Math.sin(pitch);
    if(uprightDepth<=0.01||topDepth<=0)return null;
    const screenX=foot[0]/uprightDepth;
    const screenY=(foot[1]-F*H*desired*Math.cos(pitch))/uprightDepth;
    return [(foot[0]-screenX*topDepth)/H,
      (foot[1]-screenY*topDepth)/H,verticalDepth];
  }
  // Express each projected axis directly in the sprite plane's local basis.
  // The foot is shared by both projections, so its local column is (0,0,1).
  function localTransformFromProjectedAxes(planeProjection,horizontal,vertical){
    const inverse=invert3(planeProjection);
    if(!inverse)return null;
    const x=inverse.map(row=>row[0]*horizontal[0]+row[1]*horizontal[1]+row[2]*horizontal[2]);
    const y=inverse.map(row=>row[0]*vertical[0]+row[1]*vertical[1]+row[2]*vertical[2]);
    const local=[[x[0],y[0],0],[x[1],y[1],0],[x[2],y[2],1]];
    const pts=corners().map(([u,v])=>transform3(local,u,v));
    if(pts.some(p=>!Number.isFinite(p.x+p.y)||p.w<=0))return null;
    const localYs=pts.map(p=>p.y);
    return {local,extentY:Math.max(...localYs)-Math.min(...localYs)};
  }
  // Solve the local texture transform from projected axis derivatives,
  // dimensional constraints, and the shared ground anchor.
  function computePerspectiveCorrection(planeProjection,screenBearing,tilt,desired,strength,dx,dz){
    const {targetFacing,blendWeight}=interpolateTargetOrientation(screenBearing,strength);
    const dimensions=projectedSizeConstraints(tilt,desired,dx,dz);
    if(!dimensions)return null;
    const basis=projectedAxisBasis(targetFacing,tilt);
    const fit=fitAxisScales(basis,dimensions.width,dimensions.height);
    if(!fit)return null;
    const horizontal=basis.x.map(value=>value*fit.fitX);
    const vertical=anchoredVerticalAxis(basis,fit.fitY,desired);
    if(!vertical)return null;
    const recovered=localTransformFromProjectedAxes(planeProjection,horizontal,vertical);
    if(!recovered)return null;
    return {local:recovered.local,blendWeight,fitX:fit.fitX,fitY:fit.fitY,
      extentY:recovered.extentY,maxX:dimensions.width,maxY:dimensions.height};
  }
  // Embed an XY homography in CSS matrix3d's column-major representation;
  // local Z is unchanged and the final 4×4 component stays 1.
  function matrix3dXY(local){
    const a=local[0],b=local[1],c=local[2];
    return `matrix3d(${a[0]},${b[0]},0,${c[0]},`+
      `${a[1]},${b[1]},0,${c[1]},0,0,1,0,0,0,0,1)`;
  }
  function identity3(){return [[1,0,0],[0,1,0],[0,0,1]]}
  function corners(){return [[-W/2,-H],[W/2,-H],[W/2,0],[-W/2,0]]}
  // Render stages: camera/world placement -> sprite frame -> sprite plane pose ->
  // local correction -> CSS transform -> diagnostics -> UI readouts.
  function placeWorld(){
    world.style.transform=`rotateX(${-camera.pitch}deg) rotateY(${camera.yaw}deg) `+
      `translate3d(${-camera.x}px,${-camera.y}px,${-camera.z}px)`;
    const cx=Math.round(camera.x/250)*250,cz=Math.round(camera.z/250)*250;
    ground.style.transform=`translate3d(${cx}px,0px,${cz}px) rotateX(90deg)`;
  }
  function viewingDirection(){
    const dx=camera.x-spritePosition.x,dz=camera.z-spritePosition.z;
    const bearing=Math.atan2(dx,dz),yaw=camera.yaw*RAD;
    return {dx,dz,bearing,yaw};
  }
  function spriteFrameForBearing(bearing){
    // Eight viewing sectors from five source directions; mirror the other three.
    const normalizedBearing=(((bearing+Math.PI)%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
    const sector=Math.round(normalizedBearing/(Math.PI/4))%8;
    const direction=sector<=4?sector:8-sector;
    const mirror=sector>4;
    return {direction,mirror};
  }
  function selectSpriteFrame(bearing){
    const {direction,mirror}=spriteFrameForBearing(bearing);
    if(direction!==selectedDirection||mirror!==selectedMirror){
      selectedDirection=direction;selectedMirror=mirror;
      drawSprite();
    }
  }
  // Orient the sprite plane continuously toward the camera screen. Compute a
  // separate screen-space bearing for the target projection interpolation;
  // that bearing never changes the sprite plane orientation.
  function spritePlanePose(view){
    const maxTilt=Number(tiltEl.value)*RAD;
    const tilt=Math.min(maxTilt,Math.max(0,camera.pitch*RAD)*0.8);
    const pivot=projectWorld(spritePosition.x,0,spritePosition.z);
    // Measure the camera-ground direction on screen for orientation blending.
    const cameraGround=projectWorld(camera.x,0,camera.z);
    const screenBearing=pivot&&cameraGround&&
      Math.hypot(cameraGround.x-pivot.x,cameraGround.y-pivot.y)>0.01
      ?Math.atan2(cameraGround.x-pivot.x,cameraGround.y-pivot.y)
      :view.bearing+view.yaw;
    const screenFacingYaw=-view.yaw;
    const planeProjection=planeProjectionMatrix(screenFacingYaw,tilt);
    return {tilt,screenBearing,screenFacingYaw,planeProjection};
  }
  // Convert slider values to correction parameters. Projected height shortening
  // reduces desired height progressively as positive pitch approaches 90°.
  function correctionControls(){
    const shortening=Number(shortenEl.value)/100;
    const desired=1-shortening*(1-Math.cos(Math.max(0,camera.pitch*RAD)));
    const strength=Number(warpEl.value)/100;
    return {desired,strength};
  }
  // Compute the homography and diagnostics, falling back to uncorrected sprite-plane
  // pose if the projection becomes degenerate. Optional manual shear composes
  // after the automatic fit, never as part of the geometry solver itself.
  function computeLocalCorrection(pose,view){
    const {desired,strength}=correctionControls();
    let local=identity3(),axisState='uncorrected sprite plane',localHeight=H;
    let blendWeight=0,fitX=1,fitY=1,maxX=0,maxY=0;
    const corrected=computePerspectiveCorrection(pose.planeProjection,pose.screenBearing,pose.tilt,desired,strength,view.dx,view.dz);
    if(corrected){
      local=corrected.local;
      blendWeight=corrected.blendWeight;fitX=corrected.fitX;fitY=corrected.fitY;
      localHeight=corrected.extentY;
      maxX=corrected.maxX;maxY=corrected.maxY;
      axisState='target orientation + projected axis fit';
      // User-controlled extra X shear, applied only when auto-only mode
      // is unchecked; it does not change the fitted geometric parameters.
      if(!autoShearEl.checked){
        local=shearLocalX(local,Number(shearEl.value)/100);
        axisState='geometric model + manual shear';
      }
    }else axisState='degenerate projection - uncorrected sprite plane';
    return {local,axisState,localHeight,blendWeight,fitX,fitY,maxX,maxY};
  }
  function applySpritePose(pose,correction){
    const planeTransform=`translate3d(${spritePosition.x}px,0px,${spritePosition.z}px) `+
      `rotateY(${pose.screenFacingYaw/RAD}deg) rotateX(${pose.tilt/RAD}deg) `+
      `scale(1,${1/Math.cos(pose.tilt)})`;
    // Only the texture coordinates deform. All mapped points remain at z=0.
    sprite.style.transform=planeTransform+' '+matrix3dXY(correction.local);
  }
  // Project the local vertical axis and foot anchor to measure the sprite's
  // centerline. The top-center marker supplies the rendered screen position.
  function measureSprite(pose,correction){
    const plane=pose.planeProjection,local=correction.local;
    const vertical=plane.map(row=>
      row[0]*local[0][1]+row[1]*local[1][1]+row[2]*local[2][1]);
    const foot=transform3(plane,0,0);
    const headDepth=vertical[2]*(-H)+plane[2][2];
    const head={x:(vertical[0]*(-H)+plane[0][2])/headDepth,
      y:(vertical[1]*(-H)+plane[1][2])/headDepth};
    // The marker inherits the sprite-plane 3D and local perspective transforms.
    const anchor=topCenter.getBoundingClientRect();
    const topX=anchor.x,topY=anchor.y;
    const heightPx=Math.hypot(head.x-foot.x,head.y-foot.y);
    const roll=Math.atan2(head.x-foot.x,foot.y-head.y)/RAD;
    return {topX,topY,heightPx,roll};
  }
  // Classify the currently held WASD keys in screen-transverse diagnostics;
  // diagonal motion cannot define a single measurement axis.
  function movementAxis(){
    const f=Number(keys.has('KeyW'))-Number(keys.has('KeyS'));
    const r=Number(keys.has('KeyD'))-Number(keys.has('KeyA'));
    return f&&r?'diagonal':f?'vertical':r?'horizontal':null;
  }
  // Starting movement on a different single axis resets the extrema.
  // Diagonal motion cancels the session; releasing all keys retains it.
  function updateMovementSession(movingAxis){
    if(movingAxis==='diagonal'){
      transverseExtrema.axis=null;
    }else if(movingAxis&&movingAxis!==transverseExtrema.axis){
      transverseExtrema.axis=movingAxis;
      transverseExtrema.min=Infinity;
      transverseExtrema.max=-Infinity;
    }
  }
  function setTransversePoint(id,value,vertical,topX,topY){
    $(id).setAttribute('cx',vertical?value:topX);
    $(id).setAttribute('cy',vertical?topY:value);
  }
  // Render the min/max/current markers along the transverse screen axis.
  // The checkbox controls visibility, not whether extrema are measured.
  function placeTransverseGuide(vertical,topX,topY,min,max,current){
    const half=Math.max(70,Math.abs(max-min)+16);
    const guide=$('transverseGuide');
    guide.setAttribute('x1',vertical?topX-half:topX);
    guide.setAttribute('y1',vertical?topY:topY-half);
    guide.setAttribute('x2',vertical?topX+half:topX);
    guide.setAttribute('y2',vertical?topY:topY+half);
    setTransversePoint('transverseMinimum',min,vertical,topX,topY);
    setTransversePoint('transverseMaximum',max,vertical,topX,topY);
    setTransversePoint('transverseCurrent',current,vertical,topX,topY);
    $('transverseOverlay').style.display=extremaEl.checked?'':'none';
  }
  // During pure forward/backward motion measure top-center screen X;
  // during pure strafe measure screen Y. Keep min/max after key release.
  function updateTransverseGuide(topX,topY){
    const movingAxis=movementAxis();
    updateMovementSession(movingAxis);
    let transverseRead='no single-axis session';
    if(transverseExtrema.axis){
      const vertical=transverseExtrema.axis==='vertical';
      const current=vertical?topX:topY;
      if(movingAxis===transverseExtrema.axis){
        transverseExtrema.min=Math.min(transverseExtrema.min,current);
        transverseExtrema.max=Math.max(transverseExtrema.max,current);
      }
      const min=transverseExtrema.min,max=transverseExtrema.max;
      placeTransverseGuide(vertical,topX,topY,min,max,current);
      transverseRead=`${vertical?'X':'Y'} ${current.toFixed(1)} px (min ${min.toFixed(1)}, max ${max.toFixed(1)}, drift ${(max-min).toFixed(2)})`;
    }else $('transverseOverlay').style.display='none';
    return transverseRead;
  }
  function updateControlReadouts(){
    shearEl.disabled=autoShearEl.checked;
    $('shearRead').textContent=(Number(shearEl.value)/100).toFixed(2);
    $('tiltRead').textContent=tiltEl.value+'°';
    $('shortRead').textContent=shortenEl.value+'%';
    $('speedRead').textContent=speedEl.value;
    $('warpRead').textContent=warpEl.value+'%';
  }
  function updateStats(pose,correction,measurement,transverseRead){
    const {screenFacingYaw,tilt}=pose;
    const {axisState,blendWeight,fitX,fitY,maxX,maxY,localHeight}=correction;
    const {heightPx,roll}=measurement;
    stats.textContent=`Position: ${camera.x.toFixed(0)}, ${(-camera.y).toFixed(0)} high, ${camera.z.toFixed(0)}\n`+
      `Yaw / pitch: ${camera.yaw.toFixed(0)}° / ${camera.pitch.toFixed(0)}°\n`+
      `Plane: continuous screen-facing + local XY correction\n`+
      `Sprite plane yaw: ${(screenFacingYaw/RAD).toFixed(1)}°\n`+
      `Sprite plane tilt: ${(tilt/RAD).toFixed(1)}°\n`+
      `Local XY: ${axisState}\n`+
      `Target orientation blend: ${(blendWeight*200).toFixed(0)}%\n`+
      `Target projected dimensions: ${maxX.toFixed(1)} x ${maxY.toFixed(1)} px\n`+
      `Axis scales: ${(fitX*100).toFixed(0)}% / ${(fitY*100).toFixed(0)}%\n`+
      `Projected centerline: ${heightPx.toFixed(1)} px; angle ${roll.toFixed(1)}°\n`+
      `Local Y extent: ${localHeight.toFixed(1)} / ${H} units\n`+
      `Top transverse: ${transverseRead}\n`+
      `Mouse: ${document.pointerLockElement===viewport?'locked':'unlocked'}`;
  }
  function render(){
    placeWorld();
    const view=viewingDirection();
    selectSpriteFrame(view.bearing);
    const pose=spritePlanePose(view);
    const correction=computeLocalCorrection(pose,view);
    applySpritePose(pose,correction);
    const measurement=measureSprite(pose,correction);
    const transverseRead=updateTransverseGuide(measurement.topX,measurement.topY);
    updateControlReadouts();
    updateStats(pose,correction,measurement,transverseRead);
  }
  // Input event routing -> camera controls -> frame stepping.
  function usePreset(button){
    Object.assign(camera,presets[button.dataset.preset]);
    transverseExtrema.axis=null;
    button.blur();
  }
  function handlePointerLook(event){
    if(document.pointerLockElement!==viewport)return;
    camera.yaw+=event.movementX*0.12;
    camera.pitch=Math.max(-90,Math.min(90,camera.pitch+event.movementY*0.12));
  }
  // Navigation keys operate globally even if a control had focus; other
  // typing is left to the focused control.
  function handleKeyDown(event){
    if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName)){
      if(/^(Key[WASDR]|Space|ShiftLeft|ShiftRight|ControlLeft|ControlRight|Arrow)/.test(event.code))
        document.activeElement.blur();
      else return;
    }
    if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.code))event.preventDefault();
    keys.add(event.code);
    if(event.code==='KeyH'&&!event.repeat)$('panel').hidden=!$('panel').hidden;
    // R clears the transverse measurement session.
    if(event.code==='KeyR'&&!event.repeat){Object.assign(camera,start);transverseExtrema.axis=null;}
  }
  function bindInputEvents(){
    document.querySelectorAll('[data-preset]').forEach(button=>{
      button.addEventListener('click',()=>usePreset(button));
    });
    viewport.addEventListener('click',()=>{
      if(document.pointerLockElement!==viewport)viewport.requestPointerLock();
    });
    document.addEventListener('mousemove',handlePointerLook);
    document.addEventListener('keydown',handleKeyDown);
    document.addEventListener('keyup',event=>keys.delete(event.code));
    document.addEventListener('pointerlockchange',()=>keys.clear());
    window.addEventListener('blur',()=>keys.clear());
  }
  bindInputEvents();
  let previous=performance.now();
  function applyKeyboardLook(dt){
    const look=75*dt;
    if(keys.has('ArrowLeft'))camera.yaw-=look;
    if(keys.has('ArrowRight'))camera.yaw+=look;
    if(keys.has('ArrowUp'))camera.pitch-=look;
    if(keys.has('ArrowDown'))camera.pitch+=look;
    camera.pitch=Math.max(-90,Math.min(90,camera.pitch));
  }
  // Move relative to camera yaw, with Shift/Space providing vertical input.
  // Normalize multi-axis movement so diagonal flight keeps the same speed.
  function applyKeyboardTranslation(speed,dt){
    const f=Number(keys.has('KeyW'))-Number(keys.has('KeyS'));
    const r=Number(keys.has('KeyD'))-Number(keys.has('KeyA'));
    const u=Number(keys.has('ShiftLeft')||keys.has('ShiftRight'))-Number(keys.has('Space'));
    const mag=Math.hypot(f,r,u)||1,y=camera.yaw*RAD,step=speed*dt/mag;
    camera.x+=(Math.sin(y)*f+Math.cos(y)*r)*step;
    camera.z+=(-Math.cos(y)*f+Math.sin(y)*r)*step;
    camera.y+=u*step;
  }
  function moveCamera(dt){
    const speed=Number(speedEl.value)*(keys.has('ControlLeft')||keys.has('ControlRight')?3:1);
    applyKeyboardLook(dt);
    applyKeyboardTranslation(speed,dt);
  }
  // Cap the per-frame timestep at 50 ms to limit large jumps after a pause.
  function animate(now){
    const dt=Math.min((now-previous)/1000,0.05);previous=now;
    moveCamera(dt);
    render();requestAnimationFrame(animate);
  }
  // Expose renderer state for programmatic diagnostics.
  window.__labTest={camera,render,autoShearEl,topCenter,transverseExtrema};
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
